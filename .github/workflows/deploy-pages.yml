name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Prepare project-site paths
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          mv "dist/client/$repo_name/_next" "dist/client/_next"
          rmdir "dist/client/$repo_name"
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test published map and zoom levels
        run: |
          node scripts/serve-static.cjs &
          TEST_URL=http://127.0.0.1:4173/zijin-mountain-traffic-map/ node scripts/map-smoke.cjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
